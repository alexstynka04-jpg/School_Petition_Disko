<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шкільній дискотеці — бути!</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#17102b,#32115b,#111827);color:#fff;min-height:100vh}.box{max-width:800px;margin:40px auto;padding:30px 22px;background:#ffffff18;border-radius:24px}h1{font-size:clamp(42px,8vw,68px)}.g{background:linear-gradient(90deg,#ff6ec7,#8b7cff,#5ee7ff);-webkit-background-clip:text;color:transparent}p{font-size:18px;line-height:1.6;color:#ddd}.stat{padding:18px;background:#0003;border-radius:16px;margin:25px 0}.num{font-size:38px;font-weight:bold}form{display:flex;gap:10px;margin-top:20px}input,button{padding:15px;border:0;border-radius:12px;font-size:16px}input{flex:1}button{background:#756bff;color:white;font-weight:bold}#msg{margin-top:15px}</style></head><body><div class="box"><div>🎉 Шкільна петиція</div><h1>Шкільній дискотеці — <span class="g">бути!</span></h1><p>Пропонуємо провести шкільну дискотеку, щоб учні могли відпочити, поспілкуватися та весело провести час разом після навчання.</p><div class="stat"><div class="num" id="count">…</div>людей уже підтримали</div><h2>✍️ Підтримуєш ідею?</h2><form id="form"><input id="name" placeholder="Твоє ім’я" maxlength="40" required><button>Підписати</button></form><div id="msg"></div></div><script>const db=supabase.createClient("https://vwjvldfrvqgejyqvqucj.supabase.co","sb_publishable_uAdiR8RslSjXKVKL0Sy0Yw_1lbF63uR");async function load(){const r=await db.from("signatures").select("*",{count:"exact",head:true});document.getElementById("count").textContent=r.error?"—":(r.count??0)}document.getElementById("form").onsubmit=async e=>{e.preventDefault();const n=document.getElementById("name").value.trim();const r=await db.from("signatures").insert({name:n});document.getElementById("msg").textContent=r.error?"❌ Не вдалося зберегти підпис.":"✅ Дякуємо! Підпис додано.";if(!r.error){document.getElementById("name").value="";load()}};load();</script></body></html>
